name: Zostavenie a nasadenie webu

on:
  push:
    branches: [main]
  schedule:
    # každé 2 hodiny od 6:17 do 20:17 (v lete o hodinu neskôr) + v noci o 4:17:
    # prevezme obsah zo starého webu obce a web znova zostaví
    - cron: '17 3,5-19/2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronizácia obsahu z pôvodného webu obce
        # Kým obec používa starý web, nový web si každú noc prevezme novinky, podujatia a stránky.
        # Po spustení nového webu (úrad píše v administrácii) tento krok vymažte.
        # beží pri pláne, ručnom spustení a pri commite so značkou [sync]
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sync]')
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          ./tools/import/sync.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content src/data public/media
          git diff --cached --quiet || (git commit -m "Automatická synchronizácia obsahu zo starého webu" && git pull --rebase -X theirs origin main && git push)
      - run: npm ci
      - name: Zostavenie
        run: npm run build
        env:
          # Pri vlastnej doméne nastavte BASE_PATH na "/" a SITE_URL na doménu obce
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
